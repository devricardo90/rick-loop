name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run golden vectors
        run: npm run test:golden

      - name: Verify single version declaration
        run: node --test test/core/version.test.mjs

      - name: Verify review-cost telemetry
        run: npm run loop:cost
